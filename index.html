<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام‌رسان</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #262b36;
    --text: #e6e9ef;
    --text-dim: #8b94a7;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --me: #1e3a5f;
    --them: #262b36;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3d4455; }

  /* ============ SETUP SCREEN ============ */
  #setup {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    padding: 20px;
    overflow-y: auto;
  }
  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .setup-card h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .setup-card .sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    padding: 11px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    padding: 11px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    margin-bottom: 10px;
  }
  .btn:hover { background: #232834; border-color: #333a48; }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--panel-2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .divider {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin: 14px 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 42%;
    height: 1px;
    background: var(--border);
  }
  .divider::before { right: 0; }
  .divider::after { left: 0; }
  .link-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--green);
    word-break: break-all;
    direction: ltr;
    text-align: left;
    max-height: 90px;
    overflow-y: auto;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-radius: 9px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.waiting { background: var(--yellow); animation: pulse 1.5s infinite; }
  .dot.connecting { background: var(--accent); animation: pulse 1.5s infinite; }
  .dot.connected { background: var(--green); }
  .dot.error { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .log-box {
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    max-height: 110px;
    overflow-y: auto;
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: var(--text-dim);
    direction: ltr;
    text-align: left;
    line-height: 1.7;
    margin-top: 14px;
  }
  .log-box .l-info { color: var(--accent); }
  .log-box .l-success { color: var(--green); }
  .log-box .l-warn { color: var(--yellow); }
  .log-box .l-error { color: var(--red); }

  /* ============ CHAT SCREEN ============ */
  #chat {
    display: none;
    height: 100vh;
    flex-direction: column;
  }
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chat-header .left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
  }
  .peer-info .name {
    font-weight: 600;
    font-size: 14px;
  }
  .peer-info .status-text {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }
  .peer-info .status-text .dot {
    width: 7px; height: 7px;
  }
  .chat-header .right {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: #232834; color: var(--text); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg);
  }
  .msg {
    max-width: 65%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.me {
    align-self: flex-end;
    background: var(--me);
    border-bottom-left-radius: 4px;
  }
  .msg.them {
    align-self: flex-start;
    background: var(--them);
    border-bottom-right-radius: 4px;
  }
  .msg .who {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 3px;
    font-weight: 600;
  }
  .msg img {
    max-width: 100%;
    max-height: 280px;
    border-radius: 8px;
    margin-top: 6px;
    display: block;
    cursor: pointer;
  }
  .msg .time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    text-align: left;
    direction: ltr;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 10px;
    max-width: 100%;
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer textarea {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 140px;
    min-height: 42px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .attach-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .attach-btn:hover { background: #232834; color: var(--text); }

  .emoji-picker {
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    padding: 10px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    max-height: 130px;
    overflow-y: auto;
  }
  .emoji-picker.open { display: flex; }
  .emoji-picker span {
    font-size: 20px;
    padding: 5px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .emoji-picker span:hover { background: var(--panel-2); }

  .image-viewer {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 30px;
    cursor: zoom-out;
  }
  .image-viewer.open { display: flex; }
  .image-viewer img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.8);
  }

  @media (max-width: 600px) {
    .msg { max-width: 82%; }
    .chat-header, .messages, .composer { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setup">
  <div class="setup-card">
    <h1 id="setupTitle">💬 پیام‌رسان</h1>
    <p class="sub" id="setupSub">گفتگوی دوطرفه، ساده و سریع</p>

    <!-- STEP 1: Name + Mode -->
    <div id="step1">
      <div class="field">
        <label>اسم شما</label>
        <input type="text" id="myName" placeholder="اسمت رو بنویس..." maxlength="20" />
      </div>
      <button class="btn primary" id="btnCreate">🏠 ساخت گفتگو</button>
      <div class="divider">یا</div>
      <button class="btn" id="btnJoinShow">🚪 پیوستن به گفتگو</button>
    </div>

    <!-- STEP 2: Host -->
    <div id="stepHost" style="display:none;">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">
        این لینک رو برای دوستت بفرست تا بهت وصل بشه:
      </p>
      <div class="link-box" id="myLinkBox">⏳ در حال ساخت لینک...</div>
      <button class="btn" id="btnCopy" disabled>📋 کپی لینک</button>
      <div class="status" id="hostStatus">
        <span class="dot waiting"></span>
        <span class="status-text">در حال آماده‌سازی...</span>
      </div>
      <button class="btn primary" id="btnGoChatHost" disabled>شروع گفتگو</button>
      <button class="btn ghost" id="btnBackHost">← برگشت</button>
    </div>

    <!-- STEP 3: Join -->
    <div id="stepJoin" style="display:none;">
      <div class="field">
        <label>لینک یا کد گفتگو</label>
        <input type="text" id="joinInput" placeholder="لینک کامل یا کد را وارد کن..." style="direction:ltr;text-align:left;" />
      </div>
      <button class="btn primary" id="btnConnect">🔌 اتصال</button>
      <div class="status" id="joinStatus">
        <span class="dot waiting"></span>
        <span class="status-text">در انتظار اتصال...</span>
      </div>
      <button class="btn primary" id="btnGoChatGuest" disabled>شروع گفتگو</button>
      <button class="btn ghost" id="btnBackJoin">← برگشت</button>
    </div>

    <div class="log-box" id="logBox"></div>
  </div>
</div>

<!-- ============ CHAT SCREEN ============ -->
<div id="chat">
  <div class="chat-header">
    <div class="left">
      <div class="avatar" id="peerAvatar">؟</div>
      <div class="peer-info">
        <div class="name" id="peerName">در انتظار اتصال...</div>
        <div class="status-text" id="peerStatus">
          <span class="dot waiting"></span>
          <span>آماده‌سازی</span>
        </div>
      </div>
    </div>
    <div class="right">
      <button class="icon-btn" id="btnLeave" title="قطع و بازگشت">✕</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="emoji-picker" id="emojiPicker"></div>

  <div class="composer">
    <button class="attach-btn" id="btnEmoji" title="ایموجی">😊</button>
    <button class="attach-btn" id="btnImage" title="ارسال عکس">📎</button>
    <textarea id="msgInput" placeholder="پیامت رو بنویس..." rows="1"></textarea>
    <button class="send-btn" id="btnSend" title="ارسال">➤</button>
  </div>
</div>

<div class="image-viewer" id="imageViewer">
  <img id="viewerImg" src="" alt="" />
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;" />

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ================================================================
// STATE
// ================================================================
const APP = {
  peer: null,
  conn: null,
  myId: null,
  isHost: false,
  connected: false,
  myName: localStorage.getItem('chat_name') || '',
  peerName: 'دوست',
  connectAttempted: false
};

// ================================================================
// DOM
// ================================================================
const $ = id => document.getElementById(id);
const setupEl = $('setup');
const chatEl = $('chat');
const messagesEl = $('messages');
const msgInput = $('msgInput');
const logBox = $('logBox');

// ================================================================
// LOG
// ================================================================
function log(msg, level = 'info') {
  console.log(`[APP] ${msg}`);
  const icons = { info: 'ℹ', success: '✓', warn: '⚠', error: '✕' };
  const time = new Date().toLocaleTimeString('en-US', { hour12: false });
  const el = document.createElement('div');
  el.className = 'l-' + level;
  el.textContent = `[${time}] ${icons[level] || ''} ${msg}`;
  logBox.appendChild(el);
  logBox.scrollTop = logBox.scrollHeight;
  while (logBox.children.length > 50) logBox.removeChild(logBox.firstChild);
}

// ================================================================
// STATUS UI
// ================================================================
function setStatus(elId, dotClass, text) {
  const el = $(elId);
  if (!el) return;
  const dot = el.querySelector('.dot');
  const txt = el.querySelector('.status-text');
  if (dot) dot.className = 'dot ' + dotClass;
  if (txt) txt.textContent = text;
}

function setPeerStatus(dotClass, text) {
  const el = $('peerStatus');
  if (!el) return;
  const dot = el.querySelector('.dot');
  const txt = el.querySelector('span:last-child');
  if (dot) dot.className = 'dot ' + dotClass;
  if (txt) txt.textContent = text;
}

// ================================================================
// PEER
// ================================================================
function initPeer() {
  if (APP.peer) return;
  log('راه‌اندازی سرور اتصال...', 'info');
  APP.peer = new Peer();

  APP.peer.on('open', id => {
    APP.myId = id;
    log(`آماده شد. شناسه: ${id}`, 'success');
    const link = buildLink(id);
    $('myLinkBox').textContent = link;
    $('btnCopy').disabled = false;
    setStatus('hostStatus', 'waiting', 'منتظر ورود دوستت...');
  });

  APP.peer.on('error', err => {
    log(`خطا: ${err.type}`, 'error');
    if (err.type === 'peer-unavailable') {
      setStatus('joinStatus', 'error', 'کد پیدا نشد یا طرف مقابل آفلاین است');
      APP.connectAttempted = false;
    } else if (err.type === 'unavailable-id') {
      APP.peer.destroy();
      APP.peer = null;
      setTimeout(initPeer, 800);
    }
  });

  APP.peer.on('connection', conn => {
    if (APP.conn && APP.conn.open) {
      try { conn.close(); } catch(e) {}
      return;
    }
    APP.conn = conn;
    APP.isHost = true;
    setupConnection();
  });

  APP.peer.on('disconnected', () => {
    if (APP.peer) APP.peer.reconnect();
  });
}

function buildLink(id) {
  const url = new URL(location.href);
  url.search = '';
  url.searchParams.set('join', id);
  return url.toString();
}

function connectToFriend(id) {
  if (APP.connectAttempted) return;
  APP.connectAttempted = true;
  if (!APP.peer) initPeer();

  const attempt = () => {
    if (!APP.peer || !APP.myId) { setTimeout(attempt, 300); return; }
    if (APP.conn && APP.conn.open) return;
    setStatus('joinStatus', 'connecting', 'در حال اتصال...');
    log(`اتصال به: ${id}`, 'info');
    APP.conn = APP.peer.connect(id, { reliable: true });
    APP.isHost = false;
    setupConnection();
  };
  attempt();
}

function setupConnection() {
  const conn = APP.conn;
  let opened = false;

  const onOpen = () => {
    if (opened) return;
    opened = true;
    APP.connected = true;
    log('اتصال برقرار شد!', 'success');
    setStatus('hostStatus', 'connected', 'وصل شد');
    setStatus('joinStatus', 'connected', 'وصل شدی');
    $('btnGoChatHost').disabled = false;
    $('btnGoChatGuest').disabled = false;
    send({ type: 'hello', name: APP.myName });
  };

  if (conn.open) setTimeout(onOpen, 30);
  else conn.on('open', onOpen);

  conn.on('data', data => {
    if (!data || !data.type) return;
    handleData(data);
  });

  conn.on('close', () => {
    APP.connected = false;
    log('اتصال قطع شد.', 'warn');
    setPeerStatus('error', 'قطع شد');
    addSystemMessage('اتصال قطع شد');
  });

  conn.on('error', err => {
    log(`خطای اتصال: ${err}`, 'error');
  });
}

function send(data) {
  if (APP.conn && APP.conn.open) {
    try { APP.conn.send(data); } catch(e) { log('خطا در ارسال', 'error'); }
  }
}

// ================================================================
// DATA HANDLER
// ================================================================
function handleData(data) {
  switch (data.type) {
    case 'hello':
      APP.peerName = data.name || 'دوست';
      updatePeerInfo();
      addSystemMessage(`${APP.peerName} وارد گفتگو شد`);
      break;
    case 'msg':
      addMessage(data.text, false, data.time);
      break;
    case 'img':
      addImageMessage(data.data, false, data.time);
      break;
    case 'typing':
      showTyping(data.value);
      break;
  }
}

let typingTimer = null;
function showTyping(on) {
  const el = $('peerStatus');
  if (!el) return;
  if (on) {
    clearTimeout(typingTimer);
    setPeerStatus('connected', 'در حال تایپ...');
    typingTimer = setTimeout(() => {
      setPeerStatus('connected', 'آنلاین');
    }, 2000);
  }
}

// ================================================================
// UI: PEER INFO
// ================================================================
function updatePeerInfo() {
  $('peerName').textContent = APP.peerName;
  $('peerAvatar').textContent = APP.peerName.charAt(0).toUpperCase() || '؟';
  setPeerStatus('connected', 'آنلاین');
}

// ================================================================
// MESSAGES
// ================================================================
function nowTime() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function addMessage(text, isMe, time) {
  const el = document.createElement('div');
  el.className = 'msg ' + (isMe ? 'me' : 'them');
  const who = isMe ? (APP.myName || 'من') : APP.peerName;
  el.innerHTML = `
    <div class="who">${escapeHtml(who)}</div>
    <div class="body">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
    <div class="time">${time || nowTime()}</div>
  `;
  messagesEl.appendChild(el);
  scrollBottom();
}

function addImageMessage(dataUrl, isMe, time) {
  const el = document.createElement('div');
  el.className = 'msg ' + (isMe ? 'me' : 'them');
  const who = isMe ? (APP.myName || 'من') : APP.peerName;
  el.innerHTML = `
    <div class="who">${escapeHtml(who)}</div>
    <img src="${dataUrl}" alt="عکس" />
    <div class="time">${time || nowTime()}</div>
  `;
  el.querySelector('img').onclick = () => openImageViewer(dataUrl);
  messagesEl.appendChild(el);
  scrollBottom();
}

function addSystemMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg system';
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollBottom();
}

function scrollBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ================================================================
// ACTIONS
// ================================================================
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  if (!APP.connected) {
    addSystemMessage('هنوز وصل نشدی');
    return;
  }
  addMessage(text, true);
  send({ type: 'msg', text, time: nowTime() });
  msgInput.value = '';
  autoResize();
  msgInput.focus();
}

function sendImage(dataUrl) {
  if (!APP.connected) return;
  addImageMessage(dataUrl, true);
  send({ type: 'img', data: dataUrl, time: nowTime() });
}

function openImageViewer(src) {
  $('viewerImg').src = src;
  $('imageViewer').classList.add('open');
}

function autoResize() {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(140, msgInput.scrollHeight) + 'px';
}

// ================================================================
// EVENT LISTENERS
// ================================================================
// Setup - Step 1
$('btnCreate').onclick = () => {
  const name = $('myName').value.trim() || 'کاربر';
  APP.myName = name.substring(0, 20);
  localStorage.setItem('chat_name', APP.myName);
  $('step1').style.display = 'none';
  $('stepHost').style.display = 'block';
  APP.isHost = true;
  initPeer();
};

$('btnJoinShow').onclick = () => {
  const name = $('myName').value.trim() || 'کاربر';
  APP.myName = name.substring(0, 20);
  localStorage.setItem('chat_name', APP.myName);
  $('step1').style.display = 'none';
  $('stepJoin').style.display = 'block';
  APP.isHost = false;
  initPeer();
};

// Back buttons
$('btnBackHost').onclick = () => {
  $('stepHost').style.display = 'none';
  $('step1').style.display = 'block';
};
$('btnBackJoin').onclick = () => {
  $('stepJoin').style.display = 'none';
  $('step1').style.display = 'block';
};

// Copy link
$('btnCopy').onclick = () => {
  const link = $('myLinkBox').textContent;
  if (!link || link.includes('در حال')) return;
  navigator.clipboard.writeText(link).then(() => {
    $('btnCopy').textContent = '✅ کپی شد';
    setTimeout(() => $('btnCopy').textContent = '📋 کپی لینک', 1500);
  }).catch(() => log('کپی نشد', 'warn'));
};

// Connect
$('btnConnect').onclick = () => {
  const raw = $('joinInput').value.trim();
  if (!raw) return;
  let id = raw;
  try {
    if (raw.includes('join=') || raw.startsWith('http')) {
      const url = new URL(raw.startsWith('http') ? raw : 'http://x/?join=' + raw);
      id = url.searchParams.get('join') || raw;
    }
  } catch(e) {}
  connectToFriend(id.trim());
};

// Go to chat
$('btnGoChatHost').onclick = () => enterChat();
$('btnGoChatGuest').onclick = () => enterChat();

function enterChat() {
  setupEl.style.display = 'none';
  chatEl.style.display = 'flex';
  updatePeerInfo();
  msgInput.focus();
  addSystemMessage('گفتگو شروع شد');
}

// Leave
$('btnLeave').onclick = () => {
  if (!confirm('از گفتگو خارج می‌شی؟')) return;
  location.reload();
};

// Send
$('btnSend').onclick = sendMessage;

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

msgInput.addEventListener('input', () => {
  autoResize();
  send({ type: 'typing', value: true });
});

// Image upload
$('btnImage').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    addSystemMessage('حجم عکس نباید بیشتر از ۲ مگابایت باشه');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => sendImage(ev.target.result);
  reader.readAsDataURL(file);
  e.target.value = '';
};

function buildEmojiPicker() {
  const p = $('emojiPicker');
  for (const e of EMOJIS) {
    const s = document.createElement('span');
    s.textContent = e;
    s.onclick = () => {
      msgInput.value += e;
      msgInput.focus();
      autoResize();
    };
    p.appendChild(s);
  }
}
buildEmojiPicker();

$('btnEmoji').onclick = () => {
  $('emojiPicker').classList.toggle('open');
};

// Close image viewer
$('imageViewer').onclick = () => {
  $('imageViewer').classList.remove('open');
};

// ================================================================
// INIT
// ================================================================
window.addEventListener('load', () => {
  const saved = localStorage.getItem('chat_name');
  if (saved) $('myName').value = saved;

  const params = new URLSearchParams(location.search);
  const joinId = params.get('join');

  if (joinId) {
    // Guest mode - go directly to join with auto-connect
    $('setupSub').textContent = 'به گفتگو خوش اومدی!';
    $('step1').style.display = 'none';
    $('stepJoin').style.display = 'block';
    $('joinInput').value = joinId;
    APP.isHost = false;

    // Use saved name or prompt
    const name = saved || 'کاربر';
    APP.myName = name;
    $('myName').value = name;

    initPeer();
    setTimeout(() => {
      connectToFriend(joinId);
    }, 800);
  }
});

window.addEventListener('beforeunload', () => {
  if (APP.conn && APP.conn.open) {
    try { APP.conn.close(); } catch(e) {}
  }
});
</script>
